# BrandDad Social external cron fallback.
# One runner only. Do not enable StartHost Scheduled Tasks while this workflow is active.
# Target is the standard WordPress cron entry point with no query string and no secrets.
name: BrandDad Social wp-cron
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: branddad-social-wp-cron
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call wp-cron.php
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 40 --retry 0 --proto '=https' --tlsv1.2 \
            -o /dev/null -w '%{http_code}' \
            'https://branddad.social/wp-cron.php')"
          echo "http_status=${code}"
          case "${code}" in
            200|204) exit 0 ;;
            *) echo "unexpected_status" >&2; exit 1 ;;
          esac
